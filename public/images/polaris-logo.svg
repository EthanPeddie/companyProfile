<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="polarisBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D274D" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#071326" stop-opacity="0.95" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Polaris Emblem Icon -->
  <g transform="translate(15, 10)">
    <!-- Circuit hexagon ring -->
    <polygon points="45,5 85,25 85,75 45,95 5,75 5,25" fill="url(#polarisBg)" stroke="url(#cyanGrad)" stroke-width="2" />
    
    <!-- Polaris 8-point Star -->
    <!-- Vertical and Horizontal Rays -->
    <path d="M45,15 L49,41 L75,45 L49,49 L45,75 L41,49 L15,45 L41,41 Z" fill="url(#cyanGrad)" />
    <!-- Diagonal Rays -->
    <path d="M45,30 L54,36 L60,45 L54,54 L45,60 L36,54 L30,45 L36,36 Z" fill="#FFFFFF" fill-opacity="0.8" />
    
    <!-- Central Node -->
    <circle cx="45" cy="45" r="4" fill="#FFFFFF" />
    
    <!-- Corner Circuit Dots -->
    <circle cx="85" cy="25" r="2.5" fill="#38BDF8" />
    <circle cx="85" cy="75" r="2.5" fill="#00D2FF" />
    <circle cx="5" cy="25" r="2.5" fill="#00D2FF" />
    <circle cx="5" cy="75" r="2.5" fill="#38BDF8" />
    <circle cx="45" cy="5" r="2.5" fill="#38BDF8" />
    <circle cx="45" cy="95" r="2.5" fill="#38BDF8" />
  </g>

  <!-- Typography -->
  <g transform="translate(120, 25)">
    <text x="0" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="3.5">POLARIS</text>
    <text x="0" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="url(#cyanGrad)" letter-spacing="4">TECH SOLUTION</text>
    <text x="0" y="70" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#94A3B8" letter-spacing="1.5">BESPOKE SOFTWARE &amp; ENTERPRISE SYSTEMS</text>
  </g>
</svg>
